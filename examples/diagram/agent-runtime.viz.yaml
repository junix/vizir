      - {id: validate, label: Type + reference validation, group: compiler, position: {x: 1010, y: 130}}
      - {id: mir, label: Normalized VizMIR, group: compiler, position: {x: 1010, y: 330}}
      - {id: layout, label: Layout provider, group: services, position: {x: 790, y: 330}}
      - {id: scene, label: Resolved Scene2D, group: compiler, position: {x: 570, y: 330}}
      - {id: capability, label: Capability check, group: services, position: {x: 350, y: 330}}
      - {id: svg, label: SVG target, group: backend, position: {x: 350, y: 540}}
