version: "0.1"
id: service-health-dashboard
width: 1280
height: 720
background: transparent
title: Service health and reliability review

datasets:
  services:
    key: service_id
    rows:
      - {service_id: gateway, service: Gateway, p95_ms: 118, error_rate: 0.42, budget_used: 18, team: Edge}
      - {service_id: identity, service: Identity, p95_ms: 146, error_rate: 0.31, budget_used: 9, team: Core}
      - {service_id: billing, service: Billing, p95_ms: 238, error_rate: 0.92, budget_used: 59, team: Commerce}
      - {service_id: catalog, service: Catalog, p95_ms: 174, error_rate: 0.47, budget_used: 24, team: Commerce}
      - {service_id: ranking, service: Ranking, p95_ms: 285, error_rate: 1.18, budget_used: 97, team: ML}
      - {service_id: search, service: Search, p95_ms: 211, error_rate: 0.73, budget_used: 48, team: ML}
      - {service_id: events, service: Events, p95_ms: 96, error_rate: 0.22, budget_used: 5, team: Data}
      - {service_id: profiles, service: Profiles, p95_ms: 132, error_rate: 0.36, budget_used: 14, team: Core}
      - {service_id: ledger, service: Ledger, p95_ms: 187, error_rate: 0.58, budget_used: 33, team: Commerce}
      - {service_id: features, service: Features, p95_ms: 154, error_rate: 0.51, budget_used: 28, team: Data}
      - {service_id: inference, service: Inference, p95_ms: 326, error_rate: 1.34, budget_used: 113, team: ML}
      - {service_id: notifications, service: Notify, p95_ms: 109, error_rate: 0.27, budget_used: 11, team: Edge}

views:
  - kind: chart.scatter
    id: latency-risk
    title: Latency and error exposure
    frame: {x: 0, y: 0, width: 760, height: 720}
    dataset: services
    x: {field: p95_ms, label: p95 latency (ms)}
    y: {field: error_rate, label: error rate (%)}
    color:
      field: team
      palette: ["#3B6EF5", "#18A999", "#F2A541", "#D94891", "#7A5AF8"]
    point_size: 9

  - kind: chart.bar
    id: availability-ranking
    title: 30-day error-budget consumption
    frame: {x: 760, y: 0, width: 520, height: 720}
    dataset: services
    category: {field: service, label: service}
    value: {field: budget_used, label: error budget used (%)}
    color:
      field: team
      palette: ["#3B6EF5", "#18A999", "#F2A541", "#D94891", "#7A5AF8"]
