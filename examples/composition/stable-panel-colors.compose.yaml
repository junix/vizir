# Shared domains keep Beta red in both panels. Alpha remains in the subset legend only.
schema: vizir-composition/0.5
id: stable-panel-colors
width: 1120
height: 480
background: transparent
layout:
  kind: grid
  columns: 2
  padding: 24
  gap: 24
datasets:
  both:
    key: id
    rows:
    - id: a0
      x: 0
      y: 2
      series: Alpha
    - id: a1
      x: 1
      y: 3
      series: Alpha
    - id: b0
      x: 0
      y: 7
      series: Beta
    - id: b1
      x: 1
      y: 8
      series: Beta
  subset:
    key: id
    rows:
    - id: b0
      x: 0
      y: 7
      series: Beta
    - id: b1
      x: 1
      y: 8
      series: Beta
panels:
- kind: chart.line
  id: all-series
  title: All series
  dataset: both
  x:
    field: x
    label: time
  y:
    field: y
    label: value
  series:
    field: series
    domain:
    - Alpha
    - Beta
  line_width: 4
- kind: chart.line
  id: beta-only
  title: Beta subset
  dataset: subset
  x:
    field: x
    label: time
  y:
    field: y
    label: value
  series:
    field: series
    domain:
    - Alpha
    - Beta
  line_width: 4
