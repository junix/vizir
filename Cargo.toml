[workspace]
members = [
  "crates/vizir-core",
  "crates/vizir-compiler",
  "crates/vizir-backend-svg",
  "crates/vizir-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/junix/vizir"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.20"
thiserror = "2.0"
