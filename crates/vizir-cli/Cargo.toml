[package]
name = "vizir-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "vizir"
path = "src/main.rs"

[dependencies]
clap.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "=0.11.0"
tempfile.workspace = true
unsafe-libyaml = "=0.2.11"
vizir-backend-svg = { path = "../vizir-backend-svg" }
vizir-compiler = { path = "../vizir-compiler" }
vizir-core = { path = "../vizir-core" }
vizir-web = { path = "../vizir-web" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[target.'cfg(not(unix))'.dependencies]
same-file = "1.0.6"

[dev-dependencies]
tempfile.workspace = true
roxmltree = "0.21.1"
