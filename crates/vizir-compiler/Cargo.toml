[package]
name = "vizir-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
diagram-theme = { git = "https://github.com/junix/diagram-theme-rs.git", rev = "1cc4e6667aa86444a7e9055549aa85cac293dc07" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
vizir-core = { path = "../vizir-core" }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std"] }
harfrust = { version = "=0.5.2", default-features = false, features = ["std"] }
skrifa = { version = "=0.40.0", default-features = false, features = ["std"] }
sha2 = "=0.11.0"
unicode-script = "=0.5.8"
# Pin geometry-affecting transitive APIs for the published workspace profile.
fontdb = { version = "=0.23.0", default-features = false }
ttf-parser = "=0.25.1"
unicode-bidi = "=0.3.18"
unicode-linebreak = "=0.1.5"
unicode-segmentation = "=1.13.3"
read-fonts = "=0.37.0"
font-types = "=0.11.3"
