<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690"><rect x="0" y="0" width="1200" height="690" fill="#F7F4EE"/><text x="48" y="40" font-size="12" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start" letter-spacing="2">07 · fail-loud</text><text x="48" y="74" font-size="25" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">不支持就报错，绝不静默降级</text><text x="48" y="98" font-size="13" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">一次真实实验：把 rasterizer 从 PATH 里拿走，让 PNG 渲染走投无路</text><line x1="48" y1="112" x2="1152" y2="112" stroke="#D9E1E3" stroke-width="1"/><rect x="48" y="150" width="640" height="400" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="10"/><text x="64" y="178" font-size="13" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">实验：空 PATH 下的 PNG 渲染</text><circle cx="70" cy="200" r="4" fill="#5D6873"/><text x="86" y="204" font-size="11" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">命令</text><text x="86" y="221" font-size="10.5" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">env PATH=&lt;empty&gt; vizir render service-health.viz.yaml --format png --ou…</text><circle cx="70" cy="244" r="4" fill="#E76F51"/><line x1="70" y1="226" x2="70" y2="238" stroke="#D9E1E3" stroke-width="1.5"/><text x="86" y="248" font-size="11" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">exit code</text><text x="86" y="265" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">1（非零即拒绝）</text><circle cx="70" cy="288" r="4" fill="#E76F51"/><line x1="70" y1="270" x2="70" y2="282" stroke="#D9E1E3" stroke-width="1.5"/><text x="86" y="292" font-size="11" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">stderr</text><text x="86" y="309" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">VIZ-CAP-0001: PNG output needs rsvg-convert or ImageMagick; SVG output …</text><circle cx="70" cy="332" r="4" fill="#2A9D8F"/><line x1="70" y1="314" x2="70" y2="326" stroke="#D9E1E3" stroke-width="1.5"/><text x="86" y="336" font-size="11" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">输出文件</text><text x="86" y="353" font-size="10.5" fill="#2A9D8F" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">不存在 — output_file_exists: false</text><circle cx="70" cy="376" r="4" fill="#2A9D8F"/><line x1="70" y1="358" x2="70" y2="370" stroke="#D9E1E3" stroke-width="1.5"/><text x="86" y="380" font-size="11" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">manifest</text><text x="86" y="397" font-size="10.5" fill="#2A9D8F" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">不存在 — manifest_file_exists: false</text><rect x="64" y="426" width="608" height="56" fill="#DDF2EC" stroke="#2A9D8F" stroke-width="1" rx="6"/><text x="78" y="448" font-size="11.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">半个字节都不落地：没有降级 PNG、没有空 manifest、</text><text x="78" y="466" font-size="11.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">没有「看起来成功了」。失败是原子的。</text><rect x="712" y="150" width="440" height="188" fill="#F7F4EE" stroke="#D9E1E3" stroke-width="1" rx="10" stroke-dasharray="5 4"/><text x="728" y="178" font-size="12.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">反事实：如果选择静默降级</text><text x="728" y="202" font-size="11" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">· 产出一个像素版 PNG，无任何标记；</text><text x="728" y="222" font-size="11" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">· manifest 不记录任何妥协；</text><text x="728" y="242" font-size="11" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">· 下游把降级当成功，审计时无从对质。</text><text x="728" y="272" font-size="11.5" fill="#28505C" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">vizir 的回答：unsupported_policy = &quot;error&quot;</text><rect x="712" y="356" width="440" height="194" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1" rx="6"/><text x="724" y="376.5" font-size="11" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">谈判破裂的唯一出口</text><text x="724" y="398.0" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">VizError::Diagnostic(format!(</text><text x="724" y="415.5" font-size="10.5" fill="#E76F51" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">  &quot;VIZ-CAP-0002: backend {:?} cannot lower: {failures}&quot;,</text><text x="724" y="433.0" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">  self.backend</text><text x="724" y="450.5" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">))</text><text x="724" y="468.0" font-size="10.5" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">// crates/vizir-core/src/capability.rs:127-131</text><text x="724" y="503.0" font-size="10.5" fill="#28505C" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">谈不拢 = 全部 Error 决策汇总成一条诊断，</text><text x="724" y="520.5" font-size="10.5" fill="#28505C" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">点名 backend 与它给不了的 feature。</text><text x="48" y="580" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">fail_loud.json:cap0001（exit/stderr/文件不存在性均为实测）· cli.rs 测试 png_render_without_a_rasterizer_fails_without_partial_output 同断言</text><text x="48" y="602" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">explain 的失败同样稳定：VIZ-EXPLAIN-0001 no Scene2D node named …（exit 1）</text></svg>