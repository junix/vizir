<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><rect x="0" y="0" width="1200" height="700" fill="#F7F4EE"/><text x="48" y="40" font-size="12" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start" letter-spacing="2">10 · 等价性</text><text x="48" y="74" font-size="25" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">局部补丁 ≡ 全量重算，是被测试钉死的行为</text><text x="48" y="98" font-size="13" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">主证测试：比对产出操作序列，执行之后的结果必须与直接重算的 Scene2D 语义相同</text><line x1="48" y1="112" x2="1152" y2="112" stroke="#D9E1E3" stroke-width="1"/><rect x="48" y="170" width="1104" height="240" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="10"/><rect x="72" y="210" width="180" height="96" fill="#F7F4EE" stroke="#7FA3AD" stroke-width="1.4" rx="8"/><text x="162.0" y="236" font-size="12.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">上一代场景</text><text x="162.0" y="254" font-size="9.5" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">版本 7</text><text x="162.0" y="274" font-size="9.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">两个矩形 a、b</text><line x1="255" y1="258" x2="271" y2="258" stroke="#7FA3AD" stroke-width="2"/><path d="M 264.7 261.0 L 271.0 258.0 L 264.7 255.0" stroke="#7FA3AD" stroke-width="2" fill="none"/><rect x="274" y="210" width="180" height="96" fill="#F7F4EE" stroke="#356A79" stroke-width="1.4" rx="8"/><text x="364.0" y="236" font-size="12.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">两代比对</text><text x="364.0" y="254" font-size="9.5" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">diff</text><text x="364.0" y="274" font-size="9.5" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">逐节点比对两代场景</text><line x1="457" y1="258" x2="473" y2="258" stroke="#7FA3AD" stroke-width="2"/><path d="M 466.7 261.0 L 473.0 258.0 L 466.7 255.0" stroke="#7FA3AD" stroke-width="2" fill="none"/><rect x="476" y="210" width="180" height="96" fill="#F7F4EE" stroke="#28505C" stroke-width="1.4" rx="8"/><text x="566.0" y="236" font-size="12.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">补丁信封</text><text x="566.0" y="254" font-size="9.5" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">协议 0.1</text><text x="566.0" y="274" font-size="9.5" fill="#28505C" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">操作序列 + 双版本</text><line x1="659" y1="258" x2="675" y2="258" stroke="#7FA3AD" stroke-width="2"/><path d="M 668.7 261.0 L 675.0 258.0 L 668.7 255.0" stroke="#7FA3AD" stroke-width="2" fill="none"/><rect x="678" y="210" width="180" height="96" fill="#F7F4EE" stroke="#2A9D8F" stroke-width="1.4" rx="8"/><text x="768.0" y="236" font-size="12.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">逐门校验后执行</text><text x="768.0" y="254" font-size="9.5" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">apply</text><text x="768.0" y="274" font-size="9.5" fill="#2A9D8F" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">四道门全过才执行</text><line x1="861" y1="258" x2="877" y2="258" stroke="#7FA3AD" stroke-width="2"/><path d="M 870.7 261.0 L 877.0 258.0 L 870.7 255.0" stroke="#7FA3AD" stroke-width="2" fill="none"/><rect x="880" y="210" width="180" height="96" fill="#F7F4EE" stroke="#38B764" stroke-width="1.4" rx="8"/><text x="970.0" y="236" font-size="12.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="middle">补丁后场景</text><text x="970.0" y="254" font-size="9.5" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">版本 8</text><text x="970.0" y="274" font-size="9.5" fill="#38B764" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">≈ 直接重算</text><text x="72" y="342" font-size="11.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">操作序列（测试断言的精确顺序）：</text><rect x="258" y="354" width="79.12" height="20" fill="#F7F4EE" stroke="#E76F51" stroke-width="1" rx="10"/><text x="297.56" y="367.42" font-size="9.5" fill="#E76F51" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">删节点(键=a)</text><rect x="347.12" y="354" width="118.57" height="20" fill="#F7F4EE" stroke="#356A79" stroke-width="1" rx="10"/><text x="406.4" y="367.42" font-size="9.5" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">改节点(键=b, 宽=3)</text><rect x="475.69" y="354" width="126.46" height="20" fill="#F7F4EE" stroke="#2A9D8F" stroke-width="1" rx="10"/><text x="538.92" y="367.42" font-size="9.5" fill="#2A9D8F" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">插节点(键=c, 位置=1)</text><rect x="612.15" y="354" width="126.46" height="20" fill="#F7F4EE" stroke="#28505C" stroke-width="1" rx="10"/><text x="675.38" y="367.42" font-size="9.5" fill="#28505C" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="middle">子节点排序(a,b→b,c)</text><text x="72" y="398" font-size="9.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">顺序铁律：先删 → 再改/插 → 最后排序（引擎源注释原文见 VERIFICATION · 声明 E3）</text><rect x="48" y="442" width="1104" height="178" fill="#F7F4EE" stroke="#D9E1E3" stroke-width="1" rx="10"/><text x="64" y="468" font-size="12.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">补丁机制 5 个专项测试（名称与行号收录于 VERIFICATION · 声明 E3）</text><text x="64" y="492" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start">T1</text><text x="112" y="492" font-size="10.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">主证</text><text x="258" y="492" font-size="10.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">等价性：操作顺序 + 结果场景 ≡ 全量重算（严格相等）</text><text x="64" y="516" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start">T2</text><text x="112" y="516" font-size="10.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">比对侧拒绝</text><text x="258" y="516" font-size="10.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">跨文档补丁 / 停滞版本必拒</text><text x="64" y="540" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start">T3</text><text x="112" y="540" font-size="10.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">执行侧拒绝</text><text x="258" y="540" font-size="10.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">外来补丁 / 停滞版本必拒</text><text x="64" y="564" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start">T4</text><text x="112" y="564" font-size="10.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">逐操作精确诊断</text><text x="258" y="564" font-size="10.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">每个坏操作命中它自己的诊断码</text><text x="64" y="588" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start">T5</text><text x="112" y="588" font-size="10.5" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">过期补丁必拒</text><text x="258" y="588" font-size="10.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">基线版本落后即拒（VIZ-PATCH-0005）</text><text x="48" y="640" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">补丁等价的主战场在库层（库 API 契约，非 CLI 子命令）；其 JSON Schema 由 vizir schema scene-patch 持久化防漂移</text></svg>