<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 668" width="1200" height="668"><rect x="0" y="0" width="1200" height="668" fill="#F7F4EE"/><rect x="0" y="0" width="1200" height="668" fill="#FDFBF7"/><rect x="0" y="0" width="1200" height="6" fill="#356A79"/><text x="48" y="74" font-size="12" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start" letter-spacing="2">TECHNICAL INFOGRAPHIC · vizir 0.1.0 · 可审计编译器问责</text><text x="48" y="128" font-size="40" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">可视化文档，是编译器的问责对象</text><text x="48" y="162" font-size="14" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">vizir 把一份 YAML 可视化文档编译成 SVG：途中每一级 IR、每一个节点、每一次后端降级都留下可质询的记录——</text><text x="48" y="184" font-size="14" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">节点能被 explain 溯源到数据行与生成 pass，能力不支持就以稳定诊断码 fail-loud，局部补丁必须与全量重算语义等价。</text><rect x="48.0" y="214" width="352.0" height="148" fill="#F7F4EE" stroke="#D9E1E3" stroke-width="1" rx="10"/><rect x="48.0" y="214" width="352.0" height="4" fill="#356A79" rx="2"/><text x="64.0" y="244" font-size="13" fill="#356A79" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">机制一 · 逐节点溯源</text><text x="64.0" y="264" font-size="12" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">explain</text><text x="64.0" y="288" font-size="12" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">每个 Scene2D 节点携带 Origin 责任链：HIR 来源 / </text><text x="64.0" y="307" font-size="12" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">MIR 来源 / data-key / 数据 lineage / 生成 pass /</text><text x="64.0" y="326" font-size="12" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start"> 人类可读解释。</text><rect x="424.0" y="214" width="352.0" height="148" fill="#F7F4EE" stroke="#D9E1E3" stroke-width="1" rx="10"/><rect x="424.0" y="214" width="352.0" height="4" fill="#2A9D8F" rx="2"/><text x="440.0" y="244" font-size="13" fill="#2A9D8F" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">机制二 · 能力谈判</text><text x="440.0" y="264" font-size="12" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">negotiate</text><text x="440.0" y="288" font-size="12" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">编译前为每个节点显式谈判后端能力：174 条逐节点 </text><text x="440.0" y="307" font-size="12" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">decision 写进 manifest；不支持即 VIZ-CAP 报错，绝</text><text x="440.0" y="326" font-size="12" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">不静默消失。</text><rect x="800.0" y="214" width="352.0" height="148" fill="#F7F4EE" stroke="#D9E1E3" stroke-width="1" rx="10"/><rect x="800.0" y="214" width="352.0" height="4" fill="#E76F51" rx="2"/><text x="816.0" y="244" font-size="13" fill="#E76F51" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">机制三 · 补丁等价</text><text x="816.0" y="264" font-size="12" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">apply_scene_patch</text><text x="816.0" y="288" font-size="12" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">ScenePatch 带 revision 校验：局部补丁必须证明自己</text><text x="816.0" y="307" font-size="12" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">与全量重算语义等价，base 对不上就拒绝，不猜。</text><rect x="48.0" y="392" width="170.67" height="92" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="8"/><rect x="48.0" y="392" width="4" height="92" fill="#356A79"/><text x="64.0" y="428" font-size="26" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">7</text><text x="64.0" y="448" font-size="11.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">CLI 子命令</text><text x="64.0" y="465" font-size="10.5" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">validate…schema</text><rect x="234.67" y="392" width="170.67" height="92" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="8"/><rect x="234.67" y="392" width="4" height="92" fill="#356A79"/><text x="250.67" y="428" font-size="26" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">62</text><text x="250.67" y="448" font-size="11.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">测试全过</text><text x="250.67" y="465" font-size="10.5" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">cargo test --workspace</text><rect x="421.33" y="392" width="170.67" height="92" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="8"/><rect x="421.33" y="392" width="4" height="92" fill="#356A79"/><text x="437.33" y="428" font-size="26" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">81×14</text><text x="437.33" y="448" font-size="11.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">稳定诊断码</text><text x="437.33" y="465" font-size="10.5" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">VIZ-&lt;族&gt;-NNNN</text><rect x="608.0" y="392" width="170.67" height="92" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="8"/><rect x="608.0" y="392" width="4" height="92" fill="#356A79"/><text x="624.0" y="428" font-size="26" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">110</text><text x="624.0" y="448" font-size="11.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">Scene2D 节点</text><text x="624.0" y="465" font-size="10.5" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">全部携带 Origin</text><rect x="794.67" y="392" width="170.67" height="92" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="8"/><rect x="794.67" y="392" width="4" height="92" fill="#356A79"/><text x="810.67" y="428" font-size="26" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">174</text><text x="810.67" y="448" font-size="11.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">capability decisions</text><text x="810.67" y="465" font-size="10.5" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">逐节点写入 manifest</text><rect x="981.33" y="392" width="170.67" height="92" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="8"/><rect x="981.33" y="392" width="4" height="92" fill="#356A79"/><text x="997.33" y="428" font-size="26" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">11</text><text x="997.33" y="448" font-size="11.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">examples</text><text x="997.33" y="465" font-size="10.5" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">chart/diagram/geometry/mixed</text><rect x="48" y="512" width="1104" height="4" fill="#D9E1E3"/><text x="48" y="544" font-size="12.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">本页每个数字都冻结自引擎真实运行（data/*.json + provenance.json），可逐项复现；本图构建未改动引擎任何已跟踪文件、未提交任何 commit。</text><text x="48" y="566" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">engine commit 52840b807ee6 · rustc rustc 1.98.0 · 输入 examples/chart/service-health.viz.yaml</text><text x="48" y="588" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">差异化边界：本图不讲「又一套分层 IR」也不讲「渲染确定性」——那些属于姊妹图 graph-ir-rs / plot-go；本图只讲问责三机制。</text><text x="48" y="610" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">mechanisms: scene.rs:132-142 · capability.rs:134/152 · patch.rs:64/113/457</text><text x="48" y="632" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">examples 口径：工作树 11 = 已跟踪 10 + 未跟踪 WIP 1（mixed/capacity-planning，见 engine.json 基线）；fresh clone 复现为 10</text></svg>