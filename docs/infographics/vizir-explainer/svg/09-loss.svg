<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"><rect x="0" y="0" width="1200" height="560" fill="#F7F4EE"/><text x="48" y="40" font-size="12" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start" letter-spacing="2">08 · 诚实的损耗</text><text x="48" y="74" font-size="25" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">PNG 少掉的东西，manifest 逐字记下来</text><text x="48" y="98" font-size="13" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">矢量→栅格这一步不是免费的；vizir 用 loss record 把代价写成数据，而不是藏进像素</text><line x1="48" y1="112" x2="1152" y2="112" stroke="#D9E1E3" stroke-width="1"/><rect x="48" y="150" width="1104" height="118" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1" rx="6"/><text x="60" y="171" font-size="11" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">png 渲染 manifest（真实字段值）</text><text x="60" y="193" font-size="11" fill="#E9C46A" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">run.png.manifest.json → losses: [{&quot;fidelity&quot;: &quot;rasterized&quot;, &quot;reason&quot;: &quot;vector Scene2D was rasterized after exact SVG emission&quot;, &quot;source&quot;: &quot;scene2d&quot;, &quot;target&quot;: &quot;png&quot;}]</text><text x="60" y="211" font-size="11" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">rasterizer: &quot;rsvg-convert&quot;（外部工具，版本敏感）</text><text x="60" y="229" font-size="11" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">SVG 渲染 0 loss records；Scene2D losses 为空数组</text><rect x="48.0" y="296" width="352.0" height="170" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="10"/><rect x="48.0" y="296" width="352.0" height="4" fill="#E9C46A" rx="2"/><text x="64.0" y="326" font-size="14" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">1 条 loss record</text><text x="64.0" y="346" font-size="10.5" fill="#E9C46A" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">fidelity: rasterized</text><text x="64.0" y="372" font-size="11" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">声明「矢量 Scene2D 在精确 SVG 排放之后被栅格化」——</text><text x="64.0" y="389" font-size="11" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">何时、何层、丢了什么，一格不漏。</text><rect x="424.0" y="296" width="352.0" height="170" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="10"/><rect x="424.0" y="296" width="352.0" height="4" fill="#28505C" rx="2"/><text x="440.0" y="326" font-size="14" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">外部 rasterizer</text><text x="440.0" y="346" font-size="10.5" fill="#28505C" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">rsvg-convert / ImageMagick</text><text x="440.0" y="372" font-size="11" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">PNG 由外部工具栅格化，版本敏感、跨机可漂移——所以本</text><text x="440.0" y="389" font-size="11" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">图把证据锚在 SVG+JSON 的 sha256 上。</text><rect x="800.0" y="296" width="352.0" height="170" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="10"/><rect x="800.0" y="296" width="352.0" height="4" fill="#2A9D8F" rx="2"/><text x="816.0" y="326" font-size="14" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">呈现层 ≠ 证据层</text><text x="816.0" y="346" font-size="10.5" fill="#2A9D8F" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">PNG 只作呈现</text><text x="816.0" y="372" font-size="11" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">冻结的是 SVG 与 JSON 的指纹；PNG 位图仅供阅读。噪</text><text x="816.0" y="389" font-size="11" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">声如实记录，不假装它不存在。</text><text x="48" y="494" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">capability.json:png_losses / png_rasterizer · determinism.json:manifest_noise（同路径重跑 manifest byte 级一致）</text><text x="48" y="516" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">alpha 校验另有 VIZ-ARTIFACT-0001/0002/0003 把关：透明背景必须真的透明（cli.rs verify_png_alpha）</text></svg>