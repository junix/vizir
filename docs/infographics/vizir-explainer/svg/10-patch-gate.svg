<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730"><rect x="0" y="0" width="1200" height="730" fill="#F7F4EE"/><text x="48" y="40" font-size="12" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start" letter-spacing="2">09 · revision 校验</text><text x="48" y="74" font-size="25" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">局部补丁要过四道门才被接受</text><text x="48" y="98" font-size="13" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">场景补丁携带基线/目标版本；执行侧逐门核对，任何一门不符即拒绝</text><line x1="48" y1="112" x2="1152" y2="112" stroke="#D9E1E3" stroke-width="1"/><rect x="48" y="150" width="470" height="224" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="10"/><text x="64" y="176" font-size="12.5" fill="#356A79" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">补丁信封六要素（示例取自补丁测试样例）</text><text x="64" y="200" font-size="11" fill="#28505C" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">协议版本</text><text x="158" y="200" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">0.1</text><text x="64" y="215" font-size="9.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">协议对不上即拒（0003 把关）</text><text x="64" y="229" font-size="11" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">文档标识</text><text x="158" y="229" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">doc（示例）</text><text x="64" y="244" font-size="9.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">别家的补丁贴不进本文档（0004）</text><text x="64" y="258" font-size="11" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">事务标识</text><text x="158" y="258" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">transaction/test（示例）</text><text x="64" y="273" font-size="9.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">一次补丁会话可追踪</text><text x="64" y="287" font-size="11" fill="#356A79" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">基线版本</text><text x="158" y="287" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">7（示例）</text><text x="64" y="302" font-size="9.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">必须对上当前场景版本（0005 把关）</text><text x="64" y="316" font-size="11" fill="#356A79" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">目标版本</text><text x="158" y="316" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">8（示例）</text><text x="64" y="331" font-size="9.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">必须严格前进，不许原地或倒退（0002）</text><text x="64" y="345" font-size="11" fill="#2A9D8F" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">操作列表</text><text x="158" y="345" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">删 · 改 · 插 · 排序</text><text x="64" y="360" font-size="9.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">逐操作校验：坏操作各有专属码</text><rect x="542" y="150" width="610" height="344" fill="#FDFBF7" stroke="#D9E1E3" stroke-width="1" rx="10"/><text x="558" y="178" font-size="13" fill="#17212B" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">四道拒绝门（每门一个稳定诊断码）</text><rect x="554" y="186" width="586" height="60" fill="#F7F4EE" stroke="#D9E1E3" stroke-width="1" rx="6"/><text x="564" y="204" font-size="11.5" fill="#E76F51" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start">VIZ-PATCH-0002</text><text x="712" y="204" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">target ≤ base</text><text x="712" y="222" font-size="10.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">补丁不许原地踏步或倒退</text><text x="982" y="204" font-size="10" fill="#7FA3AD" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">diff 与 apply 两侧都查</text><rect x="554" y="254" width="586" height="60" fill="#F7F4EE" stroke="#D9E1E3" stroke-width="1" rx="6"/><text x="564" y="272" font-size="11.5" fill="#E76F51" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start">VIZ-PATCH-0003</text><text x="712" y="272" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">协议版本 ≠ 0.1</text><text x="712" y="290" font-size="10.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">协议版本对不上，拒绝解释</text><text x="982" y="272" font-size="10" fill="#7FA3AD" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">apply 侧</text><rect x="554" y="322" width="586" height="60" fill="#F7F4EE" stroke="#D9E1E3" stroke-width="1" rx="6"/><text x="564" y="340" font-size="11.5" fill="#E76F51" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start">VIZ-PATCH-0004</text><text x="712" y="340" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">文档标识不匹配</text><text x="712" y="358" font-size="10.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">别家的补丁贴不进本文档</text><text x="982" y="340" font-size="10" fill="#7FA3AD" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">apply 侧</text><rect x="554" y="390" width="586" height="60" fill="#F7F4EE" stroke="#D9E1E3" stroke-width="1" rx="6"/><text x="564" y="408" font-size="11.5" fill="#E76F51" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start">VIZ-PATCH-0005</text><text x="712" y="408" font-size="10.5" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">基线版本 ≠ 当前</text><text x="712" y="426" font-size="10.5" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">场景已经前进，补丁过期即废</text><text x="982" y="408" font-size="10" fill="#7FA3AD" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">apply 侧</text><rect x="48" y="380" width="470" height="78" fill="#E3EDF0" stroke="#B9CDD3" stroke-width="1" rx="8"/><text x="64" y="402" font-size="11.5" fill="#28505C" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">补丁机制共 14 个 VIZ-PATCH 诊断码：</text><text x="64" y="421" font-size="11.5" fill="#28505C" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">0001 仅比对（diff）侧发射；0002 比对与执行两侧都查；</text><text x="64" y="440" font-size="11.5" fill="#28505C" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">其余 12 个全部在执行（apply）侧——拒绝理由全部命名。</text><text x="48" y="574" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">scene-patch.schema.json sha256 7ab3e171e09607530a569fa8…（schema 三卡见第 11 板）</text><text x="48" y="596" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">14 码清单与两侧发射位置冻结于补丁证据（声明 E3 · 源码锚点见 VERIFICATION）</text><text x="48" y="618" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">校验通过不是终点——等价性才是，见下一板</text></svg>