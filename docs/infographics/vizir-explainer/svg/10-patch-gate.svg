r="start">patch.rs:130-135</text><rect x="48" y="380" width="470" height="78" fill="#E3EDF0" stroke="#B9CDD3" stroke-width="1" rx="8"/><text x="64" y="402" font-size="11.5" fill="#28505C" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="700" text-anchor="start">patch.rs 内共 14 个 VIZ-PATCH 诊断码：</text><text x="64" y="421" font-size="11.5" fill="#28505C" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">0001 仅 diff 侧发射；0002 两侧都查（diff@:79 / apply@:138）；</text><text x="64" y="440" font-size="11.5" fill="#28505C" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">其余 12 个全部在 apply 侧——拒绝理由全部命名。</text><text x="48" y="574" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">scene-patch.schema.json sha256 7ab3e171e09607530a569fa8…（schema 三卡见第 11 板）</text><text x="48" y="596" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">patch.json:diagnostic_codes · diff_scene @ patch.rs:64 · apply_scene_patch @ patch.rs:113</text><text x="48" y="618" font-size="10.5" fill="#7FA3AD" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">校验通过不是终点——等价性才是，见下一板</text></svg>