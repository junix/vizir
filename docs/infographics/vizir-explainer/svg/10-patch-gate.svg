<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730"><rect x="0" y="0" width="1200" height="730" fill="#F7F4EE"/><text x="48" y="40" font-size="12" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="700" text-anchor="start" letter-spacing="2">09 · revision 校验</text><text x="48" y="74" font-size="25" fill="#17212B" font-family="'Source Han Serif SC','PingFang SC',serif" font-weight="700" text-anchor="start">局部补丁要过四道门才被接受</text><text x="48" y="98" font-size="13" fill="#5D6873" font-family="'Source Han Sans SC','PingFang SC',sans-serif" font-weight="400" text-anchor="start">ScenePatch 携带 base/target revision；apply 侧逐门核对，任何一门不符即拒绝</text><line x1="48" y1="112" x2="1152" y2="112" stroke="#D9E1E3" stroke-width="1"/><rect x="48" y="150" width="470" height="208" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1" rx="6"/><text x="60" y="171" font-size="11" fill="#5D6873" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">crates/vizir-core/src/patch.rs — 补丁信封</text><text x="60" y="193" font-size="11" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">ScenePatch {</text><text x="60" y="211" font-size="11" fill="#28505C" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">  protocol_version: &quot;0.1&quot;,</text><text x="60" y="229" font-size="11" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">  document_id: &quot;doc&quot;,</text><text x="60" y="247" font-size="11" fill="#17212B" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">  transaction_id: &quot;transaction/test&quot;,</text><text x="60" y="265" font-size="11" fill="#356A79" font-family="'0xProto Nerd Font','SF Mono',Menlo,monospace" font-weight="400" text-anchor="start">  base_revisio